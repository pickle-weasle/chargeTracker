<h1>Charge Tracker</h1>

<h2>Stations</h2>
<ul>
  @for (station of stations(); track station.id) {
  <li>
    {{ station.name }} - {{ station.chargingSpeed }}kW
    @if (activeSession()?.stationId === station.id) {
    <button (click)="stopSession(activeSession()!.id)">Stop</button>
    } @else {
    <button (click)="startSession(station.id)" [disabled]="activeSession() !== null">Start</button>
    }
  </li>
  }
</ul>

@if (costBreakdown(); as result) {
<app-cost-breakdown [result]="result" />
}
